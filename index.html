<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PPS – Manage Sourcing Projects</title>
    <script id="sap-ui-bootstrap"
        src="https://ui5.sap.com/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-libs="sap.m,sap.f,sap.ui.layout,sap.ui.core"
        data-sap-ui-compatVersion="edge"
        data-sap-ui-async="true"
        data-sap-ui-oninit="onInit">
    </script>
    <script>
    "use strict";
    function onInit() {
        sap.ui.require([
            "sap/m/App",
            "sap/m/Page",
            "sap/f/ShellBar",
            "sap/m/Avatar",
            "sap/m/SearchField",
            "sap/f/DynamicPage",
            "sap/f/DynamicPageTitle",
            "sap/f/DynamicPageHeader",
            "sap/m/Title",
            "sap/m/Text",
            "sap/m/Label",
            "sap/m/Link",
            "sap/m/Button",
            "sap/m/ToggleButton",
            "sap/m/OverflowToolbar",
            "sap/m/ToolbarSpacer",
            "sap/m/ToolbarSeparator",
            "sap/m/Input",
            "sap/m/Select",
            "sap/ui/core/Item",
            "sap/m/DateRangeSelection",
            "sap/m/Table",
            "sap/m/Column",
            "sap/m/ColumnListItem",
            "sap/m/ObjectStatus",
            "sap/m/ObjectIdentifier",
            "sap/m/VBox",
            "sap/m/HBox",
            "sap/m/Dialog",
            "sap/m/MessageBox",
            "sap/m/MessageStrip",
            "sap/m/MessageToast",
            "sap/ui/layout/Grid"
        ], function (
            App, Page, ShellBar, Avatar, SearchField,
            DynamicPage, DynamicPageTitle, DynamicPageHeader,
            Title, Text, Label, Link, Button, ToggleButton,
            OverflowToolbar, ToolbarSpacer, ToolbarSeparator,
            Input, Select, Item, DateRangeSelection,
            Table, Column, ColumnListItem,
            ObjectStatus, ObjectIdentifier,
            VBox, HBox,
            Dialog, MessageBox, MessageStrip, MessageToast,
            Grid
        ) {

            /* ═══════════════════════════════════════
               DATA  –  6 TF / EMD scenarios
               ═══════════════════════════════════════ */
            var aAllData = [
                { id:1, spNo:"SP-2026-0045", title:"Supply of Office Equipment – FY 2026",
                  spType:"RFQ", publishDate:"01.09.2026", submDeadline:"15.10.2026", status:"Published",
                  tfRelevant:true,  tfAmount:"5,000.00",    tfCurrency:"EUR", tfPaid:false, tfDeadline:"30.09.2026", tfPayType:"Online",
                  emdRelevant:false, emdAmount:"",           emdCurrency:"EUR", emdPaid:false, emdDeadline:"",          emdPayType:"",
                  allowViewDetails:false },

                { id:2, spNo:"SP-2026-0044", title:"IT Infrastructure Upgrade – Phase 2",
                  spType:"RFP", publishDate:"28.08.2026", submDeadline:"20.10.2026", status:"Published",
                  tfRelevant:true,  tfAmount:"10,000.00",   tfCurrency:"EUR", tfPaid:true,  tfDeadline:"10.09.2026", tfPayType:"Online",
                  emdRelevant:true,  emdAmount:"50,000.00",  emdCurrency:"EUR", emdPaid:false, emdDeadline:"01.10.2026", emdPayType:"Online",
                  allowViewDetails:true },

                { id:3, spNo:"SP-2026-0043", title:"Municipal Roads Maintenance Contract",
                  spType:"RFP", publishDate:"20.08.2026", submDeadline:"25.10.2026", status:"Published",
                  tfRelevant:true,  tfAmount:"15,000.00",   tfCurrency:"EUR", tfPaid:true,  tfDeadline:"05.09.2026", tfPayType:"Offline",
                  emdRelevant:true,  emdAmount:"100,000.00", emdCurrency:"EUR", emdPaid:true,  emdDeadline:"15.09.2026", emdPayType:"Online",
                  allowViewDetails:true },

                { id:4, spNo:"SP-2026-0042", title:"Public Health Supplies – Annual Contract",
                  spType:"RFQ", publishDate:"15.08.2026", submDeadline:"05.10.2026", status:"Published",
                  tfRelevant:false, tfAmount:"",            tfCurrency:"EUR", tfPaid:false, tfDeadline:"",          tfPayType:"",
                  emdRelevant:true,  emdAmount:"25,000.00",  emdCurrency:"EUR", emdPaid:false, emdDeadline:"20.09.2026", emdPayType:"Online",
                  allowViewDetails:true },

                { id:5, spNo:"SP-2026-0041", title:"Green Energy Solutions Procurement",
                  spType:"RFI", publishDate:"10.08.2026", submDeadline:"30.09.2026", status:"Closed",
                  tfRelevant:false, tfAmount:"",            tfCurrency:"EUR", tfPaid:false, tfDeadline:"",          tfPayType:"",
                  emdRelevant:false, emdAmount:"",           emdCurrency:"EUR", emdPaid:false, emdDeadline:"",          emdPayType:"",
                  allowViewDetails:true },

                { id:6, spNo:"SP-2026-0040", title:"Smart City Digital Infrastructure",
                  spType:"RFP", publishDate:"05.08.2026", submDeadline:"01.11.2026", status:"Published",
                  tfRelevant:true,  tfAmount:"20,000.00",   tfCurrency:"EUR", tfPaid:false, tfDeadline:"20.09.2026", tfPayType:"Online",
                  emdRelevant:true,  emdAmount:"150,000.00", emdCurrency:"EUR", emdPaid:false, emdDeadline:"01.10.2026", emdPayType:"Online",
                  allowViewDetails:false }
            ];
            var aFilteredData = aAllData.slice();

            /* ═══════════════════════════════════════
               HELPERS
               ═══════════════════════════════════════ */
            function statusState(s) {
                return s === "Published" ? "Information"
                     : s === "Awarded"   ? "Success"
                     : s === "Cancelled" ? "Error" : "None";
            }
            function paidState(b) { return b ? "Success" : "Error"; }
            function paidText(b)  { return b ? "Paid" : "Not Paid"; }
            function paidIcon(b)  { return b ? "sap-icon://accept" : "sap-icon://decline"; }

            /* ═══════════════════════════════════════
               PAYMENT DIALOG
               ═══════════════════════════════════════ */
            var oPayItem = null;
            var sPayKind = null;

            var oPaySP       = new Text({ wrapping:false });
            var oPayKindText = new Text();
            var oPayAmount   = new Text();
            var oPayDeadline = new Text();
            var oPayMethod   = new Select({ width:"100%", items:[
                new Item({ key:"NEFT", text:"NEFT – Net Banking / Internet Banking" }),
                new Item({ key:"RTGS", text:"RTGS – Real Time Gross Settlement" }),
                new Item({ key:"IMPS", text:"IMPS – Immediate Payment Service" }),
                new Item({ key:"CARD", text:"CARD – Credit / Debit Card" })
            ]});

            function row(sLabel, oControl) {
                return new HBox({ renderType:"Bare", alignItems:"Center",
                    items:[ new Label({ text:sLabel, design:"Bold", width:"11rem" }), oControl ]
                }).addStyleClass("sapUiTinyMarginBottom");
            }

            var oPayDialog = new Dialog({
                title:"Pay Tender Fees", contentWidth:"32rem",
                content:[
                    new MessageStrip({
                        text:"You will be redirected to the payment gateway. " +
                             "The callback URL will automatically update the payment status once confirmed.",
                        type:"Information", showIcon:true
                    }).addStyleClass("sapUiSmallMarginTopSmall sapUiSmallMarginBottom"),
                    new VBox({ items:[
                        row("Sourcing Project:", oPaySP),
                        row("Payment Type:",     oPayKindText),
                        row("Amount Due:",       oPayAmount),
                        row("Payment Deadline:", oPayDeadline),
                        new Label({ text:"Payment Method:", design:"Bold" }).addStyleClass("sapUiTinyMarginBottom"),
                        oPayMethod
                    ]}).addStyleClass("sapUiSmallMarginBeginEnd")
                ],
                beginButton: new Button({
                    text:"Proceed to Payment Gateway", type:"Emphasized",
                    press: function () {
                        MessageToast.show("BADI executing – generating payment gateway URL…");
                        setTimeout(function () {
                            if (oPayItem && sPayKind) {
                                if (sPayKind === "TF") { oPayItem.tfPaid  = true; }
                                else                   { oPayItem.emdPaid = true; }
                                buildRows(aFilteredData);
                                MessageToast.show(
                                    (sPayKind === "TF" ? "Tender Fee" : "EMD") +
                                    " payment confirmed via callback – " + oPayItem.spNo + " updated."
                                );
                            }
                            oPayDialog.close();
                        }, 2500);
                    }
                }),
                endButton: new Button({ text:"Cancel", press: function () { oPayDialog.close(); } })
            });

            function openPayDialog(oItem, sKind) {
                oPayItem = oItem; sPayKind = sKind;
                var tf = sKind === "TF";
                oPayDialog.setTitle(tf ? "Pay Tender Fees" : "Pay EMD (Bid Bond)");
                oPaySP.setText(oItem.spNo + " – " + oItem.title);
                oPayKindText.setText(tf ? "Tender Fee" : "Earnest Money Deposit (EMD / Bid Bond)");
                oPayAmount.setText(tf ? oItem.tfAmount  + " " + oItem.tfCurrency
                                      : oItem.emdAmount + " " + oItem.emdCurrency);
                oPayDeadline.setText(tf ? oItem.tfDeadline : oItem.emdDeadline);
                oPayDialog.open();
            }

            /* ═══════════════════════════════════════
               SHELL BAR  (sap.f.ShellBar)
               ═══════════════════════════════════════ */
            var oShellBar = new ShellBar({
                title:       "Manage Sourcing Projects",
                secondTitle: "Procurement for Public Sector",
                showMenuButton: false,
                avatar: new Avatar({
                    initials:     "BS",
                    displayShape: "Circle",
                    tooltip:      "Bozena Sudova"
                })
            });

            /* ═══════════════════════════════════════
               FILTER BAR  (inside DynamicPageHeader)
               ═══════════════════════════════════════ */
            var oSPInput     = new Input({ placeholder:"SP number or title…" });
            var oTypeSelect  = new Select({ items:[
                new Item({key:"",    text:"All Types"}),
                new Item({key:"RFQ", text:"RFQ – Request for Quotation"}),
                new Item({key:"RFP", text:"RFP – Request for Proposal"}),
                new Item({key:"RFI", text:"RFI – Request for Information"})
            ]});
            var oStatSelect  = new Select({ items:[
                new Item({key:"",          text:"All Statuses"}),
                new Item({key:"Published", text:"Published"}),
                new Item({key:"Closed",    text:"Closed"}),
                new Item({key:"Awarded",   text:"Awarded"}),
                new Item({key:"Cancelled", text:"Cancelled"})
            ]});
            var oDateRange     = new DateRangeSelection({ displayFormat:"dd.MM.yyyy" });
            var oTFRelSelect   = new Select({ items:[ new Item({key:"",text:"All"}), new Item({key:"true",text:"Yes"}), new Item({key:"false",text:"No"}) ]});
            var oTFPaidSelect  = new Select({ items:[ new Item({key:"",text:"All"}), new Item({key:"true",text:"Yes – Paid"}), new Item({key:"false",text:"No – Not Paid"}) ]});
            var oEMDRelSelect  = new Select({ items:[ new Item({key:"",text:"All"}), new Item({key:"true",text:"Yes"}), new Item({key:"false",text:"No"}) ]});
            var oEMDPaidSelect = new Select({ items:[ new Item({key:"",text:"All"}), new Item({key:"true",text:"Yes – Paid"}), new Item({key:"false",text:"No – Not Paid"}) ]});

            /* filter field helper */
            function filterField(sLabel, oCtrl) {
                return new VBox({ items:[ new Label({ text:sLabel, wrapping:false }), oCtrl ] })
                    .addStyleClass("sapUiSmallMarginBottom");
            }

            var oFilterGrid = new Grid({ defaultSpan:"L3 M6 S12", containerQuery:true, content:[
                filterField("Sourcing Project No. / Title", oSPInput),
                filterField("SP Type",                      oTypeSelect),
                filterField("Status",                       oStatSelect),
                filterField("Submission Deadline",          oDateRange),
                filterField("Tender Fee Relevant",          oTFRelSelect),
                filterField("Tender Fee Paid",              oTFPaidSelect),
                filterField("EMD Relevant",                 oEMDRelSelect),
                filterField("EMD Paid",                     oEMDPaidSelect)
            ]});

            var oFilterBar = new VBox({ items:[
                oFilterGrid,
                new OverflowToolbar({ content:[
                    new ToolbarSpacer(),
                    new Button({ text:"Restore", press: resetFilters }),
                    new Button({ text:"Go", type:"Emphasized", press: applyFilters })
                ]})
            ]});

            /* ═══════════════════════════════════════
               TABLE  (sap.m.Table – Responsive Table)
               ═══════════════════════════════════════ */
            var oCountText  = new Text({ text:"(0)" }).addStyleClass("sapUiSmallMarginBegin");
            var bPPSMode    = true;
            var aPPSCols    = [];
            var oActionsCol = new Column({ header: new Label({ text:"Actions" }), width:"13rem" });

            function col(sLabel, sWidth, bPPS, bEndAlign, bPopin) {
                var oCol = new Column({
                    header:         new Label({ text: sLabel }),
                    width:          sWidth,
                    hAlign:         bEndAlign ? "End" : "Begin",
                    minScreenWidth: bPopin    ? "Desktop" : undefined,
                    demandPopin:    bPopin    ? true : false
                });
                if (bPPS) { aPPSCols.push(oCol); }
                return oCol;
            }

            /* Live search in table results */
            var oTableSearch = new SearchField({
                width:"16rem",
                placeholder:"Search in results…",
                liveChange: function (oEvent) {
                    var sVal = oEvent.getParameter("newValue").toLowerCase();
                    var aFiltered = aFilteredData.filter(function (o) {
                        return !sVal
                            || o.spNo.toLowerCase().indexOf(sVal) > -1
                            || o.title.toLowerCase().indexOf(sVal) > -1
                            || o.vendorName && o.vendorName.toLowerCase().indexOf(sVal) > -1;
                    });
                    buildRows(aFiltered, true);
                }
            });

            var oTable = new Table({
                growing:true, growingThreshold:10,
                alternateRowColors:true,
                sticky:["ColumnHeaders","HeaderToolbar"],
                noDataText:"No sourcing projects found. Adjust your filters and try again.",
                headerToolbar: new OverflowToolbar({ content:[
                    new Title({ text:"Sourcing Projects", level:"H4" }),
                    oCountText,
                    new ToolbarSeparator(),
                    oTableSearch,
                    new ToolbarSpacer(),
                    /* PPS Mode – simulates Public Sector technical flag */
                    new ToggleButton({
                        text:"PPS: ON", pressed:true,
                        icon:"sap-icon://official-service",
                        tooltip:"Toggle Public Sector columns (simulates technical flag)",
                        press: function (oEvent) {
                            bPPSMode = oEvent.getSource().getPressed();
                            oEvent.getSource().setText("PPS: " + (bPPSMode ? "ON" : "OFF"));
                            aPPSCols.concat([oActionsCol]).forEach(function (c) { c.setVisible(bPPSMode); });
                        }
                    }),
                    new ToolbarSeparator(),
                    new Button({ icon:"sap-icon://excel-attachment", tooltip:"Export to Spreadsheet",
                        press: function () { MessageToast.show("Exporting to spreadsheet…"); } }),
                    new Button({ icon:"sap-icon://action-settings",  tooltip:"Column Settings",
                        press: function () { MessageToast.show("Column settings"); } })
                ]}),
                columns:[
                    col("SP Number",           "9rem",  false),
                    col("Title",               "18rem", false),
                    col("Type",                "5rem",  false, false, true),
                    col("Published",           "8rem",  false, false, true),
                    col("Submission Deadline", "10rem", false),
                    col("Status",              "9rem",  false),
                    /* ── PPS: Tender Fee columns ── */
                    col("TF Relevant",  "7rem",  true,  false, true),
                    col("TF Amount",    "9rem",  true,  true,  true),
                    col("TF Paid",      "7rem",  true),
                    col("TF Deadline",  "9rem",  true,  false, true),
                    /* ── PPS: EMD columns ── */
                    col("EMD Relevant", "8rem",  true,  false, true),
                    col("EMD Amount",   "9rem",  true,  true,  true),
                    col("EMD Paid",     "8rem",  true),
                    col("EMD Deadline", "9rem",  true,  false, true),
                    oActionsCol
                ]
            });

            /* ═══════════════════════════════════════
               BUILD ROWS
               ═══════════════════════════════════════ */
            function buildRows(aData, bSkipCount) {
                oTable.removeAllItems();
                aData.forEach(function (o) {
                    var bBlocked = o.tfRelevant && !o.tfPaid && !o.allowViewDetails;

                    var aButtons = [];
                    if (o.tfRelevant  && !o.tfPaid  && o.tfPayType  === "Online") {
                        aButtons.push(new Button({
                            text:"Pay TF", type:"Emphasized",
                            press:(function (i) { return function () { openPayDialog(i, "TF"); }; })(o)
                        }).addStyleClass("sapUiTinyMarginEnd"));
                    }
                    if (o.emdRelevant && !o.emdPaid && o.emdPayType === "Online") {
                        aButtons.push(new Button({
                            text:"Pay EMD", type:"Attention",
                            press:(function (i) { return function () { openPayDialog(i, "EMD"); }; })(o)
                        }));
                    }

                    oTable.addItem(new ColumnListItem({
                        type: bBlocked ? "Active" : "Navigation",
                        press:(function (item, blocked) {
                            return function () {
                                if (blocked) {
                                    MessageBox.information(
                                        "SP details cannot be viewed as Tender Fees have not been paid.\n\n" +
                                        "Tender Fee Amount : " + item.tfAmount + " " + item.tfCurrency + "\n" +
                                        "Payment Deadline  : " + item.tfDeadline + "\n\n" +
                                        "Please pay the Tender Fee to access this Sourcing Project.",
                                        { title:"Access Restricted – Tender Fees Not Paid",
                                          actions:["Pay Now", MessageBox.Action.CLOSE],
                                          onClose: function (a) { if (a === "Pay Now") openPayDialog(item, "TF"); }
                                        }
                                    );
                                } else {
                                    MessageToast.show("Opening SP Object Page: " + item.spNo);
                                }
                            };
                        })(o, bBlocked),
                        cells:[
                            /* SP Number */
                            bBlocked
                                ? new ObjectStatus({ text:o.spNo, icon:"sap-icon://private", state:"Error" })
                                : new Link({ text:o.spNo, press: function () { MessageToast.show("Open " + o.spNo); } }),
                            /* Title */
                            new Text({ text:o.title, wrapping:false }),
                            /* Type */
                            new Text({ text:o.spType }),
                            /* Published */
                            new Text({ text:o.publishDate }),
                            /* Submission Deadline */
                            new Text({ text:o.submDeadline }),
                            /* Status */
                            new ObjectStatus({ text:o.status, state:statusState(o.status) }),
                            /* TF Relevant */
                            new ObjectStatus({ text:o.tfRelevant?"Yes":"No",
                                state:o.tfRelevant?"Success":"None",
                                icon:o.tfRelevant?"sap-icon://accept":"sap-icon://decline" }),
                            /* TF Amount */
                            new Text({ text: o.tfRelevant ? o.tfAmount + " " + o.tfCurrency : "–" }),
                            /* TF Paid */
                            o.tfRelevant
                                ? new ObjectStatus({ text:paidText(o.tfPaid), state:paidState(o.tfPaid), icon:paidIcon(o.tfPaid) })
                                : new Text({ text:"N/A" }),
                            /* TF Deadline */
                            new Text({ text: o.tfDeadline || "–" }),
                            /* EMD Relevant */
                            new ObjectStatus({ text:o.emdRelevant?"Yes":"No",
                                state:o.emdRelevant?"Success":"None",
                                icon:o.emdRelevant?"sap-icon://accept":"sap-icon://decline" }),
                            /* EMD Amount */
                            new Text({ text: o.emdRelevant ? o.emdAmount + " " + o.emdCurrency : "–" }),
                            /* EMD Paid */
                            o.emdRelevant
                                ? new ObjectStatus({ text:paidText(o.emdPaid), state:paidState(o.emdPaid), icon:paidIcon(o.emdPaid) })
                                : new Text({ text:"N/A" }),
                            /* EMD Deadline */
                            new Text({ text: o.emdDeadline || "–" }),
                            /* Actions */
                            new HBox({ items: aButtons.length ? aButtons : [new Text({ text:"–" })] })
                        ]
                    }));
                });
                if (!bSkipCount) { oCountText.setText("(" + aData.length + ")"); }
            }

            /* ═══════════════════════════════════════
               FILTER LOGIC
               ═══════════════════════════════════════ */
            function applyFilters() {
                var sSP   = oSPInput.getValue().trim().toLowerCase();
                var sType = oTypeSelect.getSelectedKey();
                var sStat = oStatSelect.getSelectedKey();
                var sTFR  = oTFRelSelect.getSelectedKey();
                var sTFP  = oTFPaidSelect.getSelectedKey();
                var sEMDR = oEMDRelSelect.getSelectedKey();
                var sEMDP = oEMDPaidSelect.getSelectedKey();

                aFilteredData = aAllData.filter(function (o) {
                    if (sSP   && o.spNo.toLowerCase().indexOf(sSP) === -1
                              && o.title.toLowerCase().indexOf(sSP) === -1) return false;
                    if (sType && o.spType !== sType)                        return false;
                    if (sStat && o.status !== sStat)                        return false;
                    if (sTFR  && String(o.tfRelevant)  !== sTFR)            return false;
                    if (sTFP  && String(o.tfPaid)      !== sTFP)            return false;
                    if (sEMDR && String(o.emdRelevant) !== sEMDR)           return false;
                    if (sEMDP && String(o.emdPaid)     !== sEMDP)           return false;
                    return true;
                });
                oTableSearch.setValue("");
                buildRows(aFilteredData);
                MessageToast.show(aFilteredData.length + " sourcing project(s) found.");
            }

            function resetFilters() {
                oSPInput.setValue("");
                oTypeSelect.setSelectedKey("");
                oStatSelect.setSelectedKey("");
                oDateRange.setDateValue(null);
                oDateRange.setSecondDateValue(null);
                oTFRelSelect.setSelectedKey("");
                oTFPaidSelect.setSelectedKey("");
                oEMDRelSelect.setSelectedKey("");
                oEMDPaidSelect.setSelectedKey("");
                oTableSearch.setValue("");
                aFilteredData = aAllData.slice();
                buildRows(aFilteredData);
            }

            buildRows(aAllData);

            /* ═══════════════════════════════════════
               DYNAMIC PAGE  (Fiori List Report floorplan)
               ═══════════════════════════════════════ */
            var oDynPage = new DynamicPage({
                fitContent: true,
                title: new DynamicPageTitle({
                    heading: new Title({ text:"Manage Sourcing Projects", level:"H2", wrapping:true }),
                    snappedHeading: new Title({ text:"Manage Sourcing Projects" }),
                    actions:[
                        new Button({
                            text:"Adapt Filters", icon:"sap-icon://filter",
                            press: function () {
                                oDynPage.setHeaderExpanded(!oDynPage.getHeaderExpanded());
                            }
                        }),
                        new ToolbarSeparator(),
                        new Button({ icon:"sap-icon://share-2", tooltip:"Share",
                            press: function () { MessageToast.show("Share link copied."); } }),
                        new Button({ icon:"sap-icon://refresh", tooltip:"Refresh",
                            press: function () { buildRows(aFilteredData); MessageToast.show("List refreshed."); } })
                    ]
                }),
                header: new DynamicPageHeader({
                    pinnable: true,
                    content:[ oFilterBar ]
                }),
                content: new VBox({ items:[
                    new MessageStrip({
                        text:"TF = Tender Fee  |  EMD = Earnest Money Deposit (Bid Bond)  " +
                             "|  Locked rows ( 🔒 ) are restricted until the Tender Fee is paid.  " +
                             "|  Toggle 'PPS: ON/OFF' in the table toolbar to show or hide Public Sector columns.",
                        type:"Information", showIcon:true, showCloseButton:true
                    }).addStyleClass("sapUiSmallMarginBottom"),
                    oTable
                ]}).addStyleClass("sapUiSmallMarginBeginEnd sapUiSmallMarginBottom")
            });

            /* ═══════════════════════════════════════
               APP  –  ShellBar + DynamicPage
               ═══════════════════════════════════════ */
            new App({ pages:[
                new Page({
                    showHeader: false,
                    customHeader: oShellBar,
                    enableScrolling: false,
                    content:[ oDynPage ]
                })
            ]}).placeAt("content");
        });
    }
    </script>
</head>
<body class="sapUiBody" id="body">
    <div id="content"></div>
</body>
</html>
